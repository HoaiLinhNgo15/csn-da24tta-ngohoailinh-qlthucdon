<!doctype html>
<html>
  <head>
    <title>Đăng nhập trang Admin</title>
    <meta charset="utf-8" />
    <link href="../assets/css/css-login.css" rel="Stylesheet" />
  </head>
  <body>
    <div class="container">
      <form class="frm-login">
        <h2 id="header-login">Đăng nhập</h2>
        <label for="username">
          <input
            type="text"
            name="username"
            id="username"
            class="textbox"
            placeholder="Tên đăng nhập"
          />
        </label>
        <label for="password">
          <input
            type="password"
            name="password"
            id="password"
            class="textbox"
            placeholder="Mật khẩu"
          />
        </label>
        <div id="btn-box">
          <input type="button" value="Đăng nhập" id="btn-login" class="btn" />
          <input type="button" value="Hủy bỏ" id="btn-cancel" class="btn" />
        </div>
      </form>
    </div>
  </body>
</html>
